---
- name: Create promtail directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - ./data/promtail
    - ./data/promtail/state

- name: Generate promtail config
  ansible.builtin.template:
    src: config.yml.j2
    dest: ./data/promtail/config.yml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0644"

- name: Deploy promtail container
  community.docker.docker_container:
    name: promtail
    image: grafana/promtail:latest
    pull: true
    restart_policy: unless-stopped
    networks:
      - name: proxy
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./data/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./data/promtail/state:/data
      - /var/log:/var/log:ro
      - ./data/traefik/logs:/srv/traefik-logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env:
      TZ: "Europe/Belgrade"
    healthcheck:
      test: ["CMD", "promtail", "--version"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
