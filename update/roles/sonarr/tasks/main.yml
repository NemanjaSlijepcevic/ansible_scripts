---
- name: Set permissions on media drives
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ tv_drive }}"
    - "{{ download_drive }}"
  register: media_drive_perms
  failed_when: false

- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - "./data/sonarr"
    - "{{ download_drive }}/Download/complete/tv-sonarr"

- name: Deploy sonarr container
  community.docker.docker_container:
    name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart_policy: unless-stopped
    networks:
      - name: proxy
        ipv4_address: "{{ ip['sonarr'] }}"
    env:
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      TZ: "Europe/Belgrade"
      SONARR__AUTH__APIKEY: "{{ sonarr.api_key }}"
      SONARR__AUTH__METHOD: "External"
      SONARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      SONARR__SERVER__PORT: "{{ sonarr.port }}"
      SONARR__POSTGRES__HOST: "{{ postgres.ip }}"
      SONARR__POSTGRES__PORT: "{{ postgres.port | string }}"
      SONARR__POSTGRES__USER: "{{ postgres.user }}"
      SONARR__POSTGRES__PASSWORD: "{{ postgres.password }}"
      SONARR__POSTGRES__MAINDB: sonarr
      SONARR__POSTGRES__LOGDB: sonarr-log
      PGSSLMODE: "verify-ca"
      PGSSLCERT: "/postgres-certs/sonarr.crt"
      PGSSLKEY: "/postgres-certs/sonarr.key"
      PGSSLROOTCERT: "/postgres-certs/ca.crt"
    volumes:
      - ./data/sonarr/config:/config
      - ./data/certs:/postgres-certs:ro
      - "{{ tv_drive }}/Serije:/tv"
      - "{{ download_drive }}/Download:/downloads"
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.entrypoints: "https"
      traefik.http.routers.sonarr.rule: "{{ sonarr.host }}"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.middlewares: "chain-auth@file"
      traefik.http.services.sonarr.loadbalancer.server.port: "{{ sonarr.port }}"
    healthcheck:
      test: curl --fail http://localhost:8989/ping || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 10s

- name: Wait for Sonarr to be ready
  ansible.builtin.uri:
    url: "{{ sonarr.url }}/ping"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 10
  delay: 10

- name: Configure Transmission download client
  ansible.builtin.include_tasks: transmission.yml

- name: Configure Telegram notification
  ansible.builtin.include_tasks: telegram.yml

- name: Configure Jellyfin connection
  ansible.builtin.include_tasks: jellyfin.yml

- name: Configure settings
  ansible.builtin.include_tasks: settings.yml
