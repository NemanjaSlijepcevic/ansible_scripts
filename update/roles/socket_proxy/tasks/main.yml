---
- name: Create internal docker-api network
  community.docker.docker_network:
    name: docker-api
    internal: true

- name: Deploy docker-socket-proxy container
  community.docker.docker_container:
    name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest
    pull: true
    state: started
    restart_policy: unless-stopped
    networks:
      - name: docker-api
    env:
      LOG_LEVEL: "info"
      POST: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SECRETS: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      SESSION: "0"
      DISTRIBUTION: "0"
      AUTH: "0"
    command:
      - /bin/sh
      - -c
      - >-
        sed -i '/^backend dockerbackend$/a\    timeout server 0' /tmp/haproxy.cfg
        && exec haproxy -W -db -f /tmp/haproxy.cfg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

- name: Verify the deployment
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: ['verify']
  tags: ['verify']
