---
# Filtered Docker API for Kestra's sandbox orchestration. Kestra never sees
# /var/run/docker.sock; its Docker task runner talks to this proxy over the
# internal `docker-api` network. Scope below allows `docker run --rm`
# (create, start, wait, logs, remove, image pull, task-runner volumes) and
# nothing else — no exec into running containers, no secret listing, no
# swarm. Container-create is still host-root-equivalent, so the proxy must
# stay off the `proxy` network and unreachable from anything but Kestra.
- name: Create internal docker-api network
  community.docker.docker_network:
    name: docker-api
    internal: true

- name: Deploy docker-socket-proxy container
  community.docker.docker_container:
    name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest
    pull: true
    state: started
    restart_policy: unless-stopped
    networks:
      - name: docker-api
    env:
      LOG_LEVEL: "info"
      POST: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SECRETS: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      SESSION: "0"
      DISTRIBUTION: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # PING is enabled above, so /_ping proxies through to the docker daemon and
    # returns 200 - verifies both haproxy and the socket behind it are alive.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
