---
# This role takes no host_vars/group_vars input beyond the shared `user`
# dict documented centrally in group_vars/all.yml. The proxy's API scope is
# fixed in tasks/main.yml on purpose: widening it widens what Kestra (and
# any flow it runs) can do to the host Docker daemon.
user:
  name: "deploy"
  group: "docker"

# Scratch path verify.yml copies the running HAProxy config to, so it can
# assert the startup timeout patch actually applied. Read and deleted in the
# same run; nothing else uses it.
socket_proxy_config_probe: "/tmp/socket-proxy-haproxy.cfg"
