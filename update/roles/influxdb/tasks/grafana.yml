---
- name: Get existing Grafana data sources
  ansible.builtin.uri:
    url: "{{ grafana.url }}/api/datasources"
    method: GET
    url_username: "{{ grafana.admin_user }}"
    url_password: "{{ grafana.admin_password }}"
    force_basic_auth: true
    return_content: true
  register: existing_datasources

- name: Register InfluxDB in Grafana
  ansible.builtin.uri:
    url: "{{ grafana.url }}/api/datasources"
    method: POST
    url_username: "{{ grafana.admin_user }}"
    url_password: "{{ grafana.admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "InfluxDB"
      type: "influxdb"
      access: "proxy"
      url: "http://influxdb:{{ influxdb.port }}"
      jsonData:
        version: "Flux"
        organization: "{{ influxdb.organization }}"
        tlsSkipVerify: true
      secureJsonData:
        token: "{{ influxdb.api_token }}"
    status_code: 200
  when: existing_datasources.json | selectattr('name', 'equalto', 'InfluxDB') | list | length == 0

- name: Verify InfluxDB data source in Grafana
  ansible.builtin.uri:
    url: "{{ grafana.url }}/api/datasources"
    method: GET
    url_username: "{{ grafana.admin_user }}"
    url_password: "{{ grafana.admin_password }}"
    force_basic_auth: true
    return_content: true
  register: verify_datasources
  failed_when: verify_datasources.json | selectattr('name', 'equalto', 'InfluxDB') | list | length == 0
