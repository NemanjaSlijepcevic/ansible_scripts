---
- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "./data/influx"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"

- name: Install container
  community.docker.docker_container:
    name: influxdb
    image: influxdb:latest
    pull: true
    restart_policy: unless-stopped
    networks:
      - name: proxy
    dns_servers:
      - "{{ default.dns }}"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    env:
      TZ: "Europe/Belgrade"
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "{{ influxdb.admin_user }}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "{{ influxdb.admin_password }}"
      DOCKER_INFLUXDB_INIT_ORG: "{{ influxdb.organization }}"
      DOCKER_INFLUXDB_INIT_BUCKET: "{{ influxdb.bucket }}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "{{ influxdb.api_token }}"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.influxdb.entrypoints: "https"
      traefik.http.routers.influxdb.rule: "{{ influxdb.host }}"
      traefik.http.routers.influxdb.tls: "true"
      traefik.http.routers.influxdb.middlewares: "chain-no-auth@file"
      traefik.http.services.influxdb.loadbalancer.server.port: "{{ influxdb.port }}"

- name: Wait for InfluxDB to be ready
  ansible.builtin.uri:
    url: "{{ influxdb.url }}/health"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 15
  delay: 10

- name: Provision extra buckets
  ansible.builtin.include_tasks: buckets.yml

- name: Register in Grafana
  ansible.builtin.include_tasks: grafana.yml
