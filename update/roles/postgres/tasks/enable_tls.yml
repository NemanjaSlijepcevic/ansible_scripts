---
- name: Ensure OpenSSL is installed
  ansible.builtin.package:
    name: openssl
    state: present

- name: Create PostgreSQL TLS directory
  ansible.builtin.file:
    path: /etc/postgresql/15/main/certs
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: Generate CA key
  ansible.builtin.command:
    cmd: openssl genrsa -out /etc/postgresql/15/main/certs/ca.key 4096
    creates: /etc/postgresql/15/main/certs/ca.key

- name: Generate CA certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -new -nodes -key /etc/postgresql/15/main/certs/ca.key
      -sha256 -days 3650 -subj "/CN=postgres-ca"
      -out /etc/postgresql/15/main/certs/ca.crt
    creates: /etc/postgresql/15/main/certs/ca.crt

- name: Generate server key
  ansible.builtin.command:
    cmd: openssl genrsa -out /etc/postgresql/15/main/certs/server.key 2048
    creates: /etc/postgresql/15/main/certs/server.key

- name: Generate server CSR
  ansible.builtin.command:
    cmd: openssl req -new -key /etc/postgresql/15/main/certs/server.key -subj "/CN={{ postgres.ip }}" -out /etc/postgresql/15/main/certs/server.csr
    creates: /etc/postgresql/15/main/certs/server.csr

- name: Sign server certificate with CA
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req -in /etc/postgresql/15/main/certs/server.csr
      -CA /etc/postgresql/15/main/certs/ca.crt
      -CAkey /etc/postgresql/15/main/certs/ca.key -CAcreateserial
      -out /etc/postgresql/15/main/certs/server.crt -days 3650 -sha256
    creates: /etc/postgresql/15/main/certs/server.crt

- name: Set permissions on TLS files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/postgresql/15/main/certs/ca.key, mode: '0600' }
    - { path: /etc/postgresql/15/main/certs/ca.crt, mode: '0644' }
    - { path: /etc/postgresql/15/main/certs/server.key, mode: '0600' }
    - { path: /etc/postgresql/15/main/certs/server.crt, mode: '0644' }

- name: Enable TLS in postgresql.conf
  ansible.builtin.lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = '{{ item.value }}'"
  loop:
    - { key: ssl, value: "on" }
    - { key: ssl_cert_file, value: /etc/postgresql/15/main/certs/server.crt }
    - { key: ssl_key_file, value: /etc/postgresql/15/main/certs/server.key }
    - { key: ssl_ca_file, value: /etc/postgresql/15/main/certs/ca.crt }
  notify: Restart PostgreSQL

- name: Require client certificates for TLS connections
  ansible.builtin.blockinfile:
    path: /etc/postgresql/15/main/pg_hba.conf
    marker: "# {mark} ANSIBLE TLS"
    block: |
      hostssl all all {{ private_ips[0] }} cert clientcert=verify-full
  notify: Restart PostgreSQL

- name: Flush handlers to restart PostgreSQL with TLS
  ansible.builtin.meta: flush_handlers

- name: Ensure PostgreSQL is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    port: 5432
    host: "{{ postgres.ip }}"
    timeout: 30
