---
- name: Create environment
  ansible.builtin.include_tasks: environment.yml

- name: Set default CrowdSec collections
  ansible.builtin.set_fact:
    crowdsec_collections:
      - "crowdsecurity/traefik"
      - "crowdsecurity/http-cve"
      - "LePresidente/authelia"
      - "crowdsecurity/wordpress"

- name: Convert collections list to space-separated string
  ansible.builtin.set_fact:
    crowdsec_collections_str: "{{ crowdsec_collections | join(' ') }}"

- name: Ensure mounted host log files exist  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    modification_time: preserve
    access_time: preserve
  loop:
    - /var/log/auth.log
    - /var/log/syslog
    - /var/log/kern.log
    - /var/log/ufw.log
    - /var/log/mail.log

- name: Set default CrowdSec volumes
  ansible.builtin.set_fact:
    crowdsec_volumes:
      - ./data/crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./data/crowdsec/data:/var/lib/crowdsec/data
      - ./data/traefik/logs:/var/log/traefik/:ro
      - ./data/authelia/logs:/var/log/authelia/:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /var/log/kern.log:/var/log/kern.log:ro
      - /var/log/ufw.log:/var/log/ufw.log:ro
      - /var/log/mail.log:/var/log/mail.log:ro

- name: Create CrowdSec container
  community.docker.docker_container:
    name: crowdsec
    image: crowdsecurity/crowdsec:latest
    pull: true
    state: started
    restart_policy: unless-stopped
    security_opts:
      - "no-new-privileges:true"
    networks:
      - name: proxy
        ipv4_address: "{{ ip['crowdsec'] }}"
    env:
      TZ: "Europe/Belgrade"
      GID: "{{ user.gid | default('1000') }}"
      COLLECTIONS: "{{ crowdsec_collections_str }}"
      USE_WAL: "true"
    volumes: "{{ crowdsec_volumes }}"
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s

- name: Update
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli hub update
  register: hub_update_result
  changed_when: >
    hub_update_result.rc == 0 and
    'hub index is up to date' not in hub_update_result.stdout

- name: Upgrade CrowdSec Hub
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli hub upgrade
  register: hub_upgrade_result
  changed_when: >
    hub_upgrade_result.rc == 0 and
    (hub_upgrade_result.stdout_lines
     | reject('search', 'Action plan:|check & update data files|^\s*$')
     | list | length) > 0

- name: Register Traefik bouncer
  ansible.builtin.include_tasks: bouncer-traefik.yml

- name: Create CloudFlare bouncer
  ansible.builtin.include_tasks: bouncer-cloudflare.yml
  when: crowdsec_cloudflare_bouncer_enabled | default(false)

- name: Verify LAPI and bouncer registration
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: ['verify']
  tags: ['verify']
