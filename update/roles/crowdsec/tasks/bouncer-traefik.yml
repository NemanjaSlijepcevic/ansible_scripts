- name: Check registered bouncers
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli bouncers list -o json
  register: crowdsec_bouncers_list
  changed_when: false

- name: Register Traefik bouncer key in CrowdSec
  community.docker.docker_container_exec:
    container: crowdsec
    command: cscli bouncers add traefik-bouncer --key {{ crowdsec.traefik.bouncer_key }}
  when: "'traefik-bouncer' not in crowdsec_bouncers_list.stdout"
  changed_when: true

- name: Remove legacy bouncer-traefik sidecar container
  community.docker.docker_container:
    name: bouncer-traefik
    state: absent
