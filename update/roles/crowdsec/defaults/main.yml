---
crowdsec_cloudflare_bouncer_enabled: false

# verify.yml fails if no traefik-bouncer has pulled decisions within this many
# seconds. The plugin pulls on updateIntervalSeconds (60s), so this is a wide
# margin that still catches a bouncer that has stopped talking to LAPI.
crowdsec_bouncer_max_pull_age: 900

crowdsec:
  static: "172.20.0.3"

user:
  gid: "1000"
