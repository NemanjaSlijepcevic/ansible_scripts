---
# Documentation-only defaults for the family_trees role.
# family_trees is a list; each entry generates a static site and container.
# Copy the shape into host_vars/group_vars and replace with real values,
# then keep the real inventory encrypted. Values below are placeholders.

user:
  name: "deploy"
  group: "docker"

# Git repository holding one folder per family, each with <name>/<name>.html
# plus its <name>.html.files/ support folder. Cloned on the controller at run
# time, so no source tree has to pre-exist on the machine running the deploy.
family_trees_repo: "https://github.com/example/family-trees"
family_trees_version: "main"

# Where the clone lands on the controller. Throwaway — re-created every run.
family_trees_checkout: "/tmp/family_trees_src"

# Serbian -> Latin/English translation map rendered into dictionary.json.
dictionary:
  "Реч": "Word"
  "Пример": "Example"

family_trees:
  - name: "example_family"
    container_name: "tree_example"
    volume: "/opt/example_family"
    host_domain: "Host(`tree.example.com`)"
    static: "172.20.0.151"
