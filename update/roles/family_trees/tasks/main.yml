---
- name: Clone family tree sources on the controller
  ansible.builtin.git:
    repo: "{{ family_trees_repo }}"
    dest: "{{ family_trees_checkout }}"
    version: "{{ family_trees_version }}"
    depth: 1
    force: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate Family Trees
  ansible.builtin.include_tasks: generate_family_tree.yml
  loop: "{{ family_trees }}"
  loop_control:
    loop_var: family

- name: Create Family Trees
  ansible.builtin.include_tasks: docker_creator.yml
  loop: "{{ family_trees }}"
  loop_control:
    loop_var: family
  vars:
    container_name: "{{ family.container_name }}"
    volume: "{{ family.volume }}"
    host_domain: "{{ family.host_domain }}"
