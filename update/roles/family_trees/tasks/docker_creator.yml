---
- name: Set Traefik labels
  ansible.builtin.set_fact:
    traefik_labels: >-
      {{
        {
          'traefik.enable': 'true',
          ('traefik.http.routers.' ~ container_name ~ '.entrypoints'): 'https',
          ('traefik.http.routers.' ~ container_name ~ '.rule'): host_domain,
          ('traefik.http.routers.' ~ container_name ~ '.tls'): 'true',
          ('traefik.http.services.' ~ container_name ~ '.loadbalancer.server.port'): '80'
        }
      }}

- name: Create Docker container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: nginx:latest
    pull: true
    state: started
    restart_policy: unless-stopped
    networks:
      - name: proxy
        ipv4_address: "{{ ip[container_name] }}"
    volumes:
      - "{{ volume }}:/usr/share/nginx/html:ro"
    env:
      TZ: Europe/Belgrade
    labels: "{{ traefik_labels }}"
    # Serve-check a known static page (returns a plain 200, no redirect).
    # nginx:latest ships curl.
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-fsS"
        - "-o"
        - "/dev/null"
        - "http://localhost/{{ family.name }}.html.files/p833.html"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
