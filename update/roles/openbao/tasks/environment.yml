---
- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"
    mode: "0750"
  loop:
    - ./data/openbao
    - ./data/openbao/config
    - ./data/openbao/data
    # Audit log lives outside the Raft dir: OpenBao refuses to serve requests
    # when every enabled audit device fails to write, so it must never compete
    # with the storage backend for space or permissions.
    - ./data/openbao/audit

- name: Render OpenBao config
  ansible.builtin.template:
    src: config.hcl.j2
    dest: ./data/openbao/config/config.hcl
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"
    mode: "0640"
  register: openbao_config

# The file audit device opens the log with O_APPEND and never rotates it, so
# copytruncate is safe and the log cannot grow until the disk fills (which
# would take OpenBao down with it — a failing audit device blocks all requests).
- name: Create logrotate config for openbao audit log
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/logrotate.j2"
    dest: "/etc/logrotate.d/openbao"
    owner: "root"
    group: "root"
    mode: "0644"
  vars:
    log_path: "{{ ansible_facts.env.PWD }}/data/openbao/audit/audit.log"
    max_size: "{{ openbao_audit_log_max_size }}"
    rotate_count: "{{ openbao_audit_log_rotate_count }}"
    copytruncate: true
