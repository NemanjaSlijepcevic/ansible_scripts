---
- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "./data/traefik"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"

- name: Synchronize files
  ansible.posix.synchronize:
    src: ./
    dest: ./data/traefik/
    times: false
    rsync_opts:
      - "--chown={{ user.name }}:{{ user.group }}"
      - "--chmod=755"

- name: Check if acme.json exists
  ansible.builtin.stat:
    path: ./data/traefik/acme.json
  register: file_check

- name: Touch acme.json file
  ansible.builtin.file:
    path: ./data/traefik/acme.json
    state: touch
    mode: "0600"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
  when: not file_check.stat.exists

- name: "Generate traefik.yml"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: ./data/traefik/traefik.yml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'

- name: Catch public IP
  ansible.builtin.uri:
    url: "{{ public_ip_url }}"
    return_content: true
    headers:
      Authorization: "Bearer {{ api_ip_token }}"
  register: public_ip
  run_once: true
  changed_when: false
  check_mode: false
  when: current_host == 'server'

- name: Add public IP to private_ips list
  ansible.builtin.set_fact:
    private_ips: "{{ (private_ips | default([])) + [public_ip.json.ip] }}"
  when: current_host == 'server'

- name: "Generate rules"
  ansible.builtin.template:
    src: "{{ item }}.yml.j2"
    dest: ./data/traefik/rules/{{ item }}.yml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'
  loop:
    - basic-auth
    - default-whitelist
    - docker-metrics

- name: "Generate nas.yml"
  ansible.builtin.template:
    src: nas.yml.j2
    dest: ./data/traefik/rules/nas.yml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'
  when: current_host == 'nas'
