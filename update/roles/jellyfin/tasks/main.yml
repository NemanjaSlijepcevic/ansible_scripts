---
- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - "./data/jellyfin"
    - "./data/jellyfin/config"
    - "./data/jellyfin/cache"

- name: Deploy Jellyfin container
  community.docker.docker_container:
    name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart_policy: unless-stopped
    networks:
      - name: proxy
    env:
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      TZ: "Europe/Belgrade"
      JELLYFIN_PublishedServerUrl: "{{ jellyfin.url }}"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - "{{ data_drive }}/Knjige:/books"
      - "{{ music_drive }}:/music"
      - "{{ data_drive }}/Slike:/pictures"
      - "{{ data_drive }}/Snimci:/videos"
      - "{{ movie_drive }}:/movies"
      - "{{ tv_drive }}/Serije:/tv"
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.entrypoints: "https"
      traefik.http.routers.jellyfin.rule: "{{ jellyfin.host }}"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.middlewares: "chain-no-auth@file"
      traefik.http.services.jellyfin.loadbalancer.server.port: "{{ jellyfin.port }}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8096/health || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 10s

- name: Wait for Jellyfin to be ready
  ansible.builtin.uri:
    url: "{{ jellyfin.url }}/health"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 10
  delay: 10

- name: Configure API key
  ansible.builtin.include_tasks: apikey.yml

- name: Configure SSO
  ansible.builtin.include_tasks: sso.yml
