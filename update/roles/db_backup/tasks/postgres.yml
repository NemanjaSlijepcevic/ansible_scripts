---
- name: Inspect PostgreSQL containers
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop: "{{ db_backup_source.postgres_containers | default([]) }}"
  register: db_backup_pg_info

- name: Select running PostgreSQL containers
  ansible.builtin.set_fact:
    db_backup_pg_containers: >-
      {{ db_backup_pg_info.results
         | selectattr('exists')
         | selectattr('container.State.Running')
         | map(attribute='item')
         | list }}

- name: Warn about PostgreSQL containers that are not running
  ansible.builtin.debug:
    msg: >-
      Skipping {{ item }} — container missing or stopped on {{ inventory_hostname }}.
  loop: >-
    {{ (db_backup_source.postgres_containers | default([]))
       | difference(db_backup_pg_containers) }}

- name: Dump PostgreSQL globals (roles, tablespaces)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      docker exec {{ item }} pg_dumpall -U {{ db_backup_pg_admin_user }} --globals-only
      | gzip -c > {{ db_backup_target }}/pg_{{ item }}_globals.sql.gz
    executable: /bin/bash
  loop: "{{ db_backup_pg_containers }}"
  changed_when: true

- name: List databases per PostgreSQL container
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ item }}"
      - psql
      - -U
      - "{{ db_backup_pg_admin_user }}"
      - -tAc
      - "SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY datname"
  loop: "{{ db_backup_pg_containers }}"
  register: db_backup_pg_dbs
  changed_when: false

- name: Dump each database
  ansible.builtin.shell:
    cmd: >-
      docker exec {{ item.0.item }}
      pg_dump -U {{ db_backup_pg_admin_user }} -Fc -d '{{ item.1 }}'
      > {{ db_backup_target }}/pg_{{ item.0.item }}_{{ item.1 | regex_replace('[^A-Za-z0-9_.-]', '_') }}.dump
  loop: "{{ db_backup_pg_dbs.results | subelements('stdout_lines') }}"
  loop_control:
    label: "{{ item.0.item }} / {{ item.1 }}"
  when:
    - item.1 | trim | length > 0
    - item.1 not in db_backup_pg_exclude
  changed_when: true
