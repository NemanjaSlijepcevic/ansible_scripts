---
# OpenBao Raft snapshots. Taken over the local API rather than
# `bao operator raft snapshot save` inside the container: the CLI wants the
# token in argv or an env var, both of which are readable in `ps` on the host,
# while the API takes it in a header that no_log keeps out of the logs too.
- name: Resolve OpenBao snapshot sources
  ansible.builtin.set_fact:
    db_backup_raft_all: "{{ db_backup_source.raft | default([]) }}"

# A short-lived token minted per run from the `backup` AppRole, whose policy
# grants read on sys/storage/raft/snapshot and nothing else. This replaces a
# periodic token stored in host_vars: the inventory now carries no credential,
# and a leaked snapshot token expires on its own.
- name: Log in to OpenBao with the backup AppRole
  ansible.builtin.uri:
    url: "{{ item.url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('ansible.builtin.file', db_backup_raft_role_id_path) | trim }}"
      secret_id: "{{ lookup('ansible.builtin.file', db_backup_raft_secret_id_path) | trim }}"
    status_code: 200
  loop: "{{ db_backup_raft_all }}"
  loop_control:
    label: "{{ item.name }}"
  register: db_backup_raft_login
  no_log: true
  changed_when: false

- name: Read seal status of each OpenBao node
  ansible.builtin.uri:
    url: "{{ item.url }}/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
    method: GET
    status_code: 200
  loop: "{{ db_backup_raft_all }}"
  loop_control:
    label: "{{ item.name }}"
  register: db_backup_raft_health
  changed_when: false

# A sealed node cannot produce a snapshot — it has no root key to decrypt the
# store. Say so explicitly here; if it was the only source on this host the
# "Fail when nothing was dumped" assert in main.yml then aborts the play, which
# is correct: a sealed node has had no usable backup since the last reboot.
- name: Warn about sealed or uninitialized OpenBao nodes
  ansible.builtin.debug:
    msg: >-
      SKIPPING {{ item.item.name }} — OpenBao at {{ item.item.url }} is
      {{ 'sealed' if item.json.sealed | default(true) else 'uninitialized' }}.
      No snapshot was taken; unseal it and re-run this playbook.
  loop: "{{ db_backup_raft_health.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.json.sealed | default(true) or not (item.json.initialized | default(false))

- name: Save Raft snapshots
  ansible.builtin.uri:
    url: "{{ item.item.url }}/v1/sys/storage/raft/snapshot"
    method: GET
    headers:
      X-Vault-Token: "{{ db_backup_raft_login.results[db_backup_raft_idx].json.auth.client_token }}"
    dest: "{{ db_backup_target }}/raft_{{ item.item.name }}.snap"
    status_code: 200
  loop: "{{ db_backup_raft_health.results }}"
  loop_control:
    label: "{{ item.item.name }}"
    index_var: db_backup_raft_idx
  when:
    - not (item.json.sealed | default(true))
    - item.json.initialized | default(false)
  # The token is a header, but uri echoes the whole task args on failure.
  no_log: "{{ db_backup_no_log }}"
  changed_when: true

- name: Compress Raft snapshots
  ansible.builtin.shell:
    cmd: "gzip -f {{ db_backup_target }}/raft_{{ item.item.name }}.snap"
  loop: "{{ db_backup_raft_health.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not (item.json.sealed | default(true))
    - item.json.initialized | default(false)
  changed_when: true
