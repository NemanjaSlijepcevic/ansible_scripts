---
- name: Create environment
  ansible.builtin.include_tasks: environment.yml

- name: Add kestra
  vars:
    kestra_static_env:
      TZ: "Europe/Belgrade"
      SECRET_TELEGRAM_BOT_TOKEN: "{{ log_notification.telegram_bot | b64encode }}"
      SECRET_TELEGRAM_CHAT_ID: "{{ log_notification.chat_id | b64encode }}"
      SECRET_SMTP_USERNAME: "{{ authelia.mail.user | b64encode }}"
      SECRET_SMTP_PASSWORD: "{{ authelia.mail.password | b64encode }}"
      SECRET_OPENBAO_ROLE_ID: "{{ lookup('ansible.builtin.file', kestra_openbao_role_id_path) | trim | b64encode }}"
      SECRET_OPENBAO_SECRET_ID: "{{ lookup('ansible.builtin.file', kestra_openbao_secret_id_path) | trim | b64encode }}"
      SECRET_TELEGRAM_BRIDGE_BOT_TOKEN: "{{ kestra_bridge_bot_token | trim | b64encode }}"
      SECRET_RSYNC_SSH_KEY: "{{ kestra_rsync_ssh_key | b64encode }}"
      ENV_OPENBAO_URL: "{{ kestra_openbao_url }}"
  community.docker.docker_container:
    name: kestra
    image: kestra/kestra:latest
    pull: true
    state: started
    restart_policy: unless-stopped
    command: server standalone --config /etc/config/application.yaml
    networks:
      - name: proxy
        ipv4_address: "{{ ip['kestra'] }}"
      - name: docker-api
    dns_servers:
      - "{{ default.dns }}"
    env: "{{ kestra_static_env | combine(kestra_webhook_env) }}"
    volumes:
      - ./data/kestra/application.yml:/etc/config/application.yaml:ro
      - ./data/kestra/storage:/app/storage
      - ./data/certs/ca.crt:/app/certs/ca.crt:ro
      - ./data/certs/kestra.crt:/app/certs/kestra.crt:ro
      - ./data/certs/kestra.key.pk8:/app/certs/kestra.key.pk8:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.kestra.entrypoints: "https"
      traefik.http.routers.kestra.rule: "{{ kestra.host }}"
      traefik.http.routers.kestra.tls: "true"
      traefik.http.routers.kestra.middlewares: "chain-auth@file"
      traefik.http.services.kestra.loadbalancer.server.port: "{{ kestra.port }}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 120s
