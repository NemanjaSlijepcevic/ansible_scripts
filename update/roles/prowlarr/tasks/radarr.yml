---
- name: Get existing Prowlarr applications
  ansible.builtin.uri:
    url: "{{ prowlarr.url }}/api/v1/applications"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr.api_key }}"
    return_content: true
  register: existing_apps

- name: Add Radarr to Prowlarr
  ansible.builtin.uri:
    url: "{{ prowlarr.url }}/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr.api_key }}"
    body_format: json
    body:
      name: "Radarr"
      implementation: "Radarr"
      implementationName: "Radarr"
      configContract: "RadarrSettings"
      enable: true
      syncLevel: "fullSync"
      fields:
        - name: prowlarrUrl
          value: "http://prowlarr:9696"
        - name: baseUrl
          value: "http://radarr:7878"
        - name: apiKey
          value: "{{ radarr.api_key }}"
        - name: syncCategories
          value: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]
    status_code: 201
  when: "existing_apps.json | selectattr('name', 'equalto', 'Radarr') | list | length == 0"

- name: Verify Radarr exists in Prowlarr
  ansible.builtin.uri:
    url: "{{ prowlarr.url }}/api/v1/applications"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr.api_key }}"
    return_content: true
  register: verify_apps
  failed_when: "verify_apps.json | selectattr('name', 'equalto', 'Radarr') | list | length == 0"
