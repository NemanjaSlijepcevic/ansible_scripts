---
- name: Create environment
  ansible.builtin.include_tasks: environment.yml

- name: Build claude-runner image
  community.docker.docker_image:
    name: "{{ claude_runner.image.split(':')[0] }}"
    tag: "{{ claude_runner.image.split(':')[1] | default('latest') }}"
    source: build
    build:
      path: "{{ ansible_facts.env.PWD }}/data/claude-runner/build"
      pull: true
      nocache: "{{ runner_update | default(false) | bool }}"
    force_source: "{{ (runner_update | default(false) | bool) or (claude_runner_dockerfile.changed | default(false)) }}"
