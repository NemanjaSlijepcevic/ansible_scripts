---
user:
  name: "deploy"
  group: "docker"

puid: "1000"
pgid: "1000"

grafana:
  url: "https://grafana.example.com"
  host: "Host(`grafana.example.com`)"
  port: "3000"

# Per-logger log level overrides (GF_LOG_FILTERS, "logger:level" CSV).
# `expr:error` silences benign "missing numeric fields" warn spam from empty
# alert frames; `tsdb.loki:error` drops the per-query "Response received from
# loki" info lines. Errors still log. Set to "" to restore full verbosity.
grafana_log_filters: "expr:error,tsdb.loki:error"

# Authelia OIDC endpoint used for SSO login.
authelia_links:
  url: "https://auth.example.com"

# Kestra webhook the "Kestra" alert contact point posts firing alerts to.
# The trailing segment is the target flow's webhook trigger key, which is the
# only auth on that URL — treat the whole URL as a secret. The key itself lives
# in kv/homelab/kestra/webhooks (see docs/update/kestra.md); this var must be
# kept in step with it by hand.
grafana_alert_webhook: "https://kestra.example.com/api/v1/main/executions/webhook/automation/grafana-alert-triage/changeme"

# Hosts monitored by alert rules. Each entry is a current_host value used in
# update/<host>.yml — it matches the `host` (metrics) and `node` (logs) label
# Alloy stamps on every series.
monitored_hosts:
  - "nas"
  - "server"
  - "monitor"
  - "postgres"
  - "netboot"
  # immich host not deployed yet — uncomment when it starts pushing
  # metrics, or its node-gap/log-gap dead-man rules fire forever
  # - "immich"
  - "automation"

# Hosts whose Traefik metrics are watched by the 5xx/p95 alert rules.
traefik_alert_hosts:
  - "nas"
  - "server"
  - "monitor"
  - "netboot"
  - "postgres"
  # HIDDEN: automation serves almost no HTTP, so the 5xx/p95 queries return
  # empty frames → Grafana errors the rule and floods "missing numeric
  # fields". Re-enable (and drop the two matching deleteRules in
  # rules.yaml.j2) once the host has real traffic or the rule tolerates
  # empty data.
  # - "automation"

# Alert thresholds for HTTP uptime and system rules.
alerts:
  http_for: "3m"                    # service-down evaluation window
  rt_warn: 1.0                      # response_time seconds
  rt_crit: 3.0
  rt_for: "5m"
  node_gap_for: "5m"                # no node_exporter data → node down
  cpu_warn: 90                      # cpu busy %
  cpu_for: "10m"
  mem_warn: 90                      # mem used %
  mem_for: "10m"
  disk_crit: 90                     # filesystem used %
  disk_for: "5m"
  # Proxmox (prometheus-pve-exporter)
  proxmox_cpu_warn: 85              # %
  proxmox_mem_warn: 85              # %
  proxmox_for: "10m"
  # Traefik (per-host metrics, host label)
  traefik_5xx_rate: 5               # req/s sustained
  traefik_5xx_for: "5m"
  traefik_p95_warn: 2.0             # seconds
  traefik_p95_for: "5m"
  # pfSense (node_exporter on FreeBSD, host="pfsense")
  pfsense_cpu_warn: 80              # %
  pfsense_mem_warn: 85              # %
  pfsense_for: "10m"
  wan_down_for: "5m"
  # WAN interface (pfSense node_exporter device label)
  wan_interface: "vtnet0.5"
  # Central PostgreSQL (postgres-exporter, host="postgres")
  pg_gap_for: "3m"                  # pg_up == 0 → server or agent down
  pg_conn_warn: 80                  # total backends; PG default max_connections=100
  pg_conn_for: "5m"
  pg_deadlock_for: "5m"
  # Docker containers (docker_container_exited / _oom_killed textfile gauges)
  container_for: "2m"
  # Log pipeline (Loki datasource; Alloy labels every line with node=<host>)
  log_gap_for: "5m"
  # Home Assistant sensors (Prometheus /api/prometheus, hass_* metrics)
  ha_down_for: "5m"                 # up{job=homeassistant}==0 → HA or scrape down
  ha_leak_regex: ".*water.*|.*leak.*|.*smoke.*|.*gas.*"  # binary_sensors = safety alarms
  ha_leak_for: "0s"                 # leak/smoke → alert immediately
  ha_battery_warn: 25               # sensor battery %
  ha_battery_exclude: ".*oneplus.*|.*iphone.*|.*phone.*"  # skip personal phones
  ha_battery_for: "1h"
  ha_offline_regex: ".*_temperature|.*_humidity"          # climate sensors that must keep reporting
  ha_offline_for: "20m"
  # TLS certs (blackbox probe_ssl_earliest_cert_expiry)
  cert_warn_days: 21
  cert_crit_days: 7
  cert_for: "15m"
  # Node extras (node_exporter)
  reboot_window: "15m"              # unexpected-reboot detection window
  reboot_for: "0s"
  fs_readonly_for: "2m"
  hwtemp_warn: 85                   # °C — hardware sensor overheating
  hwtemp_for: "10m"
  # CrowdSec engine metrics scrape (job=crowdsec, :6060)
  crowdsec_down_for: "5m"
  # Kestra (micrometer metrics on the automation host, job=kestra, :8081)
  kestra_down_for: "5m"             # up{job=kestra}==0 → server or scrape down
  kestra_failed: 0                  # fire above N FAILED/KILLED executions in 15m
  kestra_failed_for: "5m"
  kestra_worker_pending: 20         # queued worker jobs backing up
  kestra_worker_pending_for: "10m"
  kestra_log_errors: 10             # ERROR lines from the kestra container in 15m
  kestra_log_errors_for: "10m"
