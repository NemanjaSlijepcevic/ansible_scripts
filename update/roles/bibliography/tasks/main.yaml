---
- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - "./data/bibliography"
    - "./data/bibliography/staticfiles"

- name: Check if db.sqlite3 file exists
  ansible.builtin.stat:
    path: ./data/bibliography/db.sqlite3
  register: file_stat

- name: "Copy SQLite database file"
  ansible.builtin.copy:
    src: ./db.sqlite3
    dest: ./data/bibliography/db.sqlite3
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  when: not file_stat.stat.exists

- name: Deploy bibliography container
  community.docker.docker_container:
    name: bibliography
    image: nemanjaslijepcevic/bibliography:latest
    restart_policy: unless-stopped
    pull: true
    dns_servers:
      - "{{ default.dns }}"
    networks:
      - name: proxy
        ipv4_address: "{{ ip['bibliography'] }}"
    env:
      TZ: "Europe/Belgrade"
      DEFAULT_DOMAIN: "{{ bibliography.domain }}"
      EXTRA_DOMAIN: "{{ bibliography.extra_domain }}"
      SECRET_KEY: "{{ bibliography.secret_key }}"
    volumes:
      - "./data/bibliography/db.sqlite3:/app/db.sqlite3"
      - "./data/bibliography/staticfiles:/app/staticfiles"
    # Django rejects a non-domain Host with 400, so a plain curl/wget would fail
    # even when healthy. Probe with the bundled python: any HTTP response < 500
    # means gunicorn is serving; a connection error/timeout means it is not.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/'); sys.exit(0 if c.getresponse().status<500 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.bibliography.entrypoints: "https"
      traefik.http.routers.bibliography.rule: "{{ bibliography.host }}"
      traefik.http.routers.bibliography.tls: "true"
      traefik.http.services.bibliography.loadbalancer.server.port: "{{ bibliography.port }}"
