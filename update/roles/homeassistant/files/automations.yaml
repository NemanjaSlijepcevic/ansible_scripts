- id: '1725695093439'
  alias: Uredjaj je nedostupan
  description: ''
  trigger:
  - platform: state
    entity_id:
    - light.komoda
    - light.kuhinja
    - sensor.backup_battery
    - sensor.tuyatemp2_battery
    - sensor.tuyatemp1_battery
    - sensor.aquartemp_battery
    - sensor.water_b_battery
    - sensor.water_battery
    - climate.153931628460388_climate
    from:
    to: unavailable
    for:
      hours: 0
      minutes: 5
      seconds: 0
  condition: []
  action:
  - action: telegram_bot.send_message
    metadata: {}
    data:
      message: ⚠️ {{ trigger.to_state.name }} nije dostupan
  mode: single
- id: '1725696158984'
  alias: Baterija prazna
  description: ''
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.backup_battery
    - sensor.tuyatemp2_battery
    - sensor.tuyatemp1_battery
    - sensor.aquartemp_battery
    - sensor.water_b_battery
    - sensor.water_battery
