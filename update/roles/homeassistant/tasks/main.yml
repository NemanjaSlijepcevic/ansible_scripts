---
- name: Create directories if they don't exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - "./data/homeassistant"
    - "./data/homeassistant/config"

- name: Render configuration.yaml
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: ./data/homeassistant/config/configuration.yaml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0644"
  register: ha_config

- name: Sync automations.yaml
  ansible.builtin.copy:
    src: automations.yaml
    dest: ./data/homeassistant/config/automations.yaml
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0644"
    force: false
  register: ha_automations

- name: Add MQTT
  ansible.builtin.include_tasks: mqtt.yml

- name: Deploy container
  community.docker.docker_container:
    name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    # privileged: true
    restart: "{{ ha_config.changed or ha_automations.changed }}"
    restart_policy: unless-stopped
    networks:
      - name: proxy
    env:
      TZ: "Europe/Belgrade"
    volumes:
      - ./data/homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      traefik.enable: "true"
      traefik.http.routers.homeassistant.entrypoints: "https"
      traefik.http.routers.homeassistant.rule: "{{ homeassistant.host }}"
      traefik.http.routers.homeassistant.tls: "true"
      traefik.http.routers.homeassistant.middlewares: "chain-no-auth@file"
      traefik.http.services.homeassistant.loadbalancer.server.port: "{{ homeassistant.port }}"
