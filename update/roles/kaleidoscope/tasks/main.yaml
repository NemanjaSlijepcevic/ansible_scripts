---
- name: Create directory if they don't exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  loop:
    - "./data/kaleidoscope"
    - "./data/kaleidoscope/staticfiles"
    - "./data/kaleidoscope/media"

- name: Check if db.sqlite3 file exists
  ansible.builtin.stat:
    path: ./data/kaleidoscope/db.sqlite3
  register: file_stat

- name: "Copy SQLite database file"
  ansible.builtin.copy:
    src: ./db.sqlite3
    dest: ./data/kaleidoscope/db.sqlite3
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
  when: not file_stat.stat.exists

- name: Deploy kaleidoscope container
  community.docker.docker_container:
    name: kaleidoscope
    image: nemanjaslijepcevic/kaleidoscope:latest
    restart_policy: unless-stopped
    pull: true
    dns_servers:
      - "{{ default.dns }}"
    networks:
      - name: proxy
        ipv4_address: "{{ ip['kaleidoscope'] }}"
    env:
      TZ: "Europe/Belgrade"
      DEFAULT_DOMAIN: "{{ kaleidoscope.domain }}"
      EXTRA_DOMAIN: "{{ kaleidoscope.extra_domain }}"
      SECRET_KEY: "{{ kaleidoscope.secret_key }}"
      IMAGE_WATERMARK_TEXT: "{{ kaleidoscope.watermark }}"
    volumes:
      - "./data/kaleidoscope/db.sqlite3:/app/db.sqlite3"
      - "./data/kaleidoscope/staticfiles:/app/staticfiles"
      - "./data/kaleidoscope/media:/app/media"
    # Django rejects a non-domain Host with 400, so a strict wget/curl fails
    # even when healthy. Probe with the bundled python: any HTTP response < 500
    # means the app is serving; a connection error/timeout means it is not.
    # (localhost resolves to ::1 and is refused - use 127.0.0.1.)
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/'); sys.exit(0 if c.getresponse().status<500 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.kaleidoscope.entrypoints: "https"
      traefik.http.routers.kaleidoscope.rule: "{{ kaleidoscope.host }}"
      traefik.http.routers.kaleidoscope.tls: "true"
      traefik.http.services.kaleidoscope.loadbalancer.server.port: "{{ kaleidoscope.port }}"
