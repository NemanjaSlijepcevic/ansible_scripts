---
# Documentation-only defaults for the kaleidoscope role.
# Copy the shape into host_vars/group_vars and replace with real values,
# then keep the real inventory encrypted. Values below are placeholders.

user:
  name: "deploy"
  group: "docker"

default:
  dns: "192.0.2.1"

kaleidoscope:
  static: "172.20.0.141"
  domain: "gallery.example.com"
  extra_domain: "photos.example.com"
  internal_hosts: "kaleidoscope"
  secret_key: "changeme"
  watermark: "example.com"
  host: "Host(`gallery.example.com`)"
  port: "8000"
  # Origin of the page that embeds this app in an iframe (the Ghost site).
  # A bare origin: scheme, host, optional port - no trailing slash or path,
  # because it is compared against event.origin, which never carries one.
  # Leave empty and the app still works: it falls back to posting its height
  # to "*", but the script and dark-mode toggles in the Ghost header stop
  # reaching inside the frame.
  embed_parent_origin: "https://blog.example.com"
