  name: "deploy"
  group: "docker"

default:
  dns: "192.0.2.1"

kaleidoscope:
  static: "172.20.0.141"
  domain: "gallery.example.com"
  extra_domain: "photos.example.com"
  secret_key: "changeme"
  watermark: "example.com"
  host: "Host(`gallery.example.com`)"
  port: "8000"
