---
- name: Ensure PostgreSQL Python dependencies are installed
  ansible.builtin.package:
    name: python3-psycopg2
    state: present

- name: Check if core databases exist
  community.postgresql.postgresql_query:
    login_user: "{{ postgres.adm_user }}"
    login_password: "{{ postgres.adm_pass }}"
    login_host: "{{ postgres.ip | default('localhost') }}"
    login_port: "{{ postgres.port | default(5432) }}"
    login_db: postgres
    query: "SELECT 1 FROM pg_database WHERE datname = '{{ item }}';"
  loop:
    - authelia
  loop_control:
    label: "{{ item }}"
  register: core_db_check
  changed_when: false
  no_log: false
  environment:
    PGSSLMODE: "verify-ca"
    PGSSLCERT: "./data/certs/postgres_admin.crt"
    PGSSLKEY: "./data/certs/postgres_admin.key"
    PGSSLROOTCERT: "./data/certs/ca.crt"

- name: Prepare db for applications
  ansible.builtin.include_tasks: create_db_and_user.yml
  vars:
    admin_user: "{{ postgres.adm_user }}"
    admin_password: "{{ postgres.adm_pass }}"
    admin_host: "{{ postgres.ip | default('localhost') }}"
    admin_port: "{{ postgres.port | default(5432) }}"
    admin_rights: false
    db_user: "{{ db.user }}"
    db_pass: "{{ db.password }}"
    db_name: "{{ db.name }}"
  loop:
    - name: authelia
      user: "{{ authelia_db.user }}"
      password: "{{ authelia_db.password }}"
  loop_control:
    loop_var: db
    label: "{{ db.name }}"
    extended: true
  when: (core_db_check.results[ansible_loop.index0].rowcount | default(0)) == 0
  no_log: true

- name: Prepare PostgreSQL for the nas
  ansible.builtin.include_tasks: prepare_nas.yml
  when: current_host | default('') == 'nas'

- name: Prepare PostgreSQL for the automation host
  ansible.builtin.include_tasks: prepare_automation.yml
  when: current_host | default('') == 'automation'
