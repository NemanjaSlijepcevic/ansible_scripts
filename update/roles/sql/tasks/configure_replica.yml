---
- name: Install required Python MySQL library
  ansible.builtin.pip:
    name: PyMySQL
    state: present

- name: Get IP address of the primary MySQL container
  community.docker.docker_container_info:
    name: "{{ db_server[0].name }}"
  register: primary_container_info

- name: Get IP address of the replica MySQL container
  community.docker.docker_container_info:
    name: "{{ db_server[1].name }}"
  register: replica_container_info

- name: Set primary MySQL host IP
  ansible.builtin.set_fact:
    primary_mysql_ip: "{{ primary_container_info.container.NetworkSettings.Networks.proxy.IPAddress }}"

- name: Set replica MySQL host IP
  ansible.builtin.set_fact:
    replica_mysql_ip: "{{ replica_container_info.container.NetworkSettings.Networks.proxy.IPAddress }}"

- name: Set replica MySQL host IP
  ansible.builtin.set_fact:
    replica_mysql_ip:
- name: Debug primary MySQL IP
  ansible.builtin.debug:
    var: primary_mysql_ip

- name: Debug replica MySQL IP
  ansible.builtin.debug:
    var: replica_mysql_ip

- name: Configure Primary MySQL server
  community.mysql.mysql_query:
    login_host: "{{ primary_mysql_ip }}"
    login_user: "{{ db_server[0].admin }}"
    login_password: "{{ db_server[0].pass }}"
    query: |
      CREATE USER '{{ db_server[1].user }}'@'%' IDENTIFIED BY '{{ db_server[1].pass }}';
      GRANT REPLICATION SLAVE ON *.* TO '{{ db_server[1].user }}'@'%';
      FLUSH PRIVILEGES;
      SHOW MASTER STATUS;
  register: master_status

- name: Extract master log file and position
  ansible.builtin.set_fact:
    master_log_file: "{{ master_status.query_result[-1]['File'] }}"
    master_log_pos: "{{ master_status.query_result[-1]['Position'] }}"

- name: Configure Replica MySQL server
  community.mysql.mysql_query:
    login_host: "{{ replica_container_info }}"
    login_user: "{{ db_server[1].admin }}"
    login_password: "{{ db_server[1].pass }}"
    query: |
      CHANGE MASTER TO
        MASTER_HOST='{{ db_server[0].name }}',
        MASTER_USER='{{ db_server[1].user }}',
        MASTER_PASSWORD='{{ db_server[1].pass }}',
        MASTER_LOG_FILE='{{ master_log_file }}',
        MASTER_LOG_POS={{ master_log_pos }};
      START SLAVE;
      SHOW SLAVE STATUS\G;

- name: Verify replication status
  community.mysql.mysql_query:
    login_host: "{{ replica_mysql_ip }}"
    login_user: "{{ db_server[1].admin }}"
    login_password: "{{ db_server[1].pass }}"
    query: SHOW SLAVE STATUS\G;
  register: slave_status

- name: Debug slave replication status
  ansible.builtin.debug:
    var: slave_status.query_result
