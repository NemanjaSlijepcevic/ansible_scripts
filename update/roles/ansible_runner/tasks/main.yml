---
# Builds the ansible-runner image only — no long-lived container. Kestra's
# AnsibleCLI task (io.kestra.plugin.ansible.cli.AnsibleCLI) runs it as its
# containerImage through the socket proxy (Docker task runner,
# host: tcp://socket-proxy:2375), e.g. a flow task:
#
#   type: io.kestra.plugin.ansible.cli.AnsibleCLI
#   containerImage: {{ ansible_runner.image }}
#   taskRunner:
#     type: io.kestra.plugin.scripts.runner.docker.Docker
#     networkMode: "{{ claude_runner.network }}"
#     volumes:
#       - <deploy-dir>/data/ansible-runner/workspace:/workspace
#       - <deploy-dir>/data/ansible-runner/secrets/<key>.ppk:/root/<key>.ppk:ro
#       - <deploy-dir>/data/ansible-runner/secrets/pass.file:/secrets/pass.file:ro
#   commands:
#     - ansible-playbook -i /workspace/ansible_scripts/update nas.yml
#       --vault-password-file /secrets/pass.file
#
# Volume sources are HOST paths (the proxy talks to the host daemon).
# The key mounts at /root/<key>.ppk because the inventory's
# ansible_private_key_file points there. Clone/update the repo in a prior
# task in the same flow (same image, git is installed).
- name: Create environment
  ansible.builtin.include_tasks: environment.yml

# Pass -e runner_update=true to force a no-cache rebuild that picks up the
# latest base image, latest ansible-core, and latest collections.
- name: Build ansible-runner image
  community.docker.docker_image:
    name: "{{ ansible_runner.image.split(':')[0] }}"
    tag: "{{ ansible_runner.image.split(':')[1] | default('latest') }}"
    source: build
    build:
      path: "{{ ansible_facts.env.PWD }}/data/ansible-runner/build"
      pull: true
      nocache: "{{ runner_update | default(false) | bool }}"
    force_source: "{{ (runner_update | default(false) | bool) or (ansible_runner_dockerfile.changed | default(false)) }}"
