---
- name: Generate timestamp
  ansible.builtin.set_fact:
    ssh_key_timestamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

- name: Generate SSH key pair locally
  community.crypto.openssh_keypair:
    path: "{{ role_path }}/files/{{ new_user }}_{{ ssh_key_timestamp }}.pem"
    type: ed25519
  delegate_to: localhost
  run_once: true

- name: Set SSH public key path
  ansible.builtin.set_fact:
    new_user_key_path: "{{ role_path }}/files/{{ new_user }}_{{ ssh_key_timestamp }}.pem.pub"
