---
- name: Create new users on remote machine
  hosts: new
  gather_facts: true
  remote_user: "{{ ansible_user }}"
  become: true
  vars_prompt:
    - name: "new_user"
      prompt: "Enter the username"
      private: false
      default: ""
    - name: "user_password"
      prompt: "Enter the password for the new users"
      private: true
    - name: "user_password_confirm"
      prompt: "Confirm the password for the new users"
      private: true
  roles:
    - { role: install_packages, tags: ['install_packages', 'bootstrap'] }
    - { role: prepare_ssh, tags: ['prepare_ssh', 'ssh', 'security', 'bootstrap'] }
    - { role: create_new_users, tags: ['create_new_users', 'bootstrap'] }
    - { role: protect_ssh, tags: ['protect_ssh', 'ssh', 'security', 'hardening'] }
    - { role: prepare_firewall, tags: ['prepare_firewall', 'security', 'hardening'] }
    - { role: install_docker, tags: ['install_docker', 'bootstrap'] }
    - { role: clean_up, tags: ['clean_up'] }
